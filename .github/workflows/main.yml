
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: Smart_Visual_Auto_Clicker_Windows_EXE_Builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        working-directory: Smart_Visual_Auto_Clicker_Windows_EXE_Builder
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SmartVisualAutoClicker --collect-all cv2 --collect-all pynput smart_visual_autoclicker.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartVisualAutoClicker-Windows-x64
          path: Smart_Visual_Auto_Clicker_Windows_EXE_Builder/dist/SmartVisualAutoClicker.exe
